
<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e2a5e">
    <title>Reserves · Nothingan Pri S.A.</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div th:replace="~{fragments/office :: topbar}"></div>

<div class="app">
    <input type="checkbox" id="side" class="side-toggle" aria-label="Menú de gestió">
    <div th:replace="~{fragments/office :: sidebar(activeMenu='reserves')}"></div>
    <label class="scrim" for="side" aria-label="Tancar el menú"></label>

    <main class="main">

        <!-- Missatges d'èxit o error -->
        <div th:if="${missatge}" class="alert ok mb"
             style="color: #3c763d; background-color: #dff0d8; padding: 15px; border-radius: 4px; margin-bottom: 20px;">
            <strong th:text="${missatge}"></strong>
        </div>

        <div th:if="${error}" class="alert err mb"
             style="color: #a94442; background-color: #f2dede; padding: 15px; border-radius: 4px; margin-bottom: 20px;">
            <strong th:text="${error}"></strong>
        </div>

        <!-- FORMULARI DE FILTRES (RF54) -->
        <div class="card" style="margin-bottom: 20px; padding: 15px;">
            <form th:action="@{/reserva/meves}" method="GET"
                  style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;">

                <div>
                    <label for="codi" style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;">
                        Codi Reserva
                    </label>
                    <input type="text" id="codi" name="codi" placeholder="Ex: 346683FC"
                           style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div>
                    <label for="matricula" style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;">
                        Matrícula
                    </label>
                    <input type="text" id="matricula" name="matricula"
                           style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div>
                    <label for="data" style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;">
                        Data Inici
                    </label>
                    <input type="date" id="data" name="data"
                           style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div sec:authorize="hasAnyRole('ADMIN','ADMINISTRADOR','AGENT')">
                    <label for="email" style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;">
                        Email Client
                    </label>
                    <input type="email" id="email" name="email"
                           style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div>
                    <button type="submit" class="btn"
                            style="background-color: #1e2a5e; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                        Filtrar
                    </button>

                    <a th:href="@{/reserva/meves}"
                       style="margin-left: 10px; color: #d9534f; text-decoration: none; font-size: 14px;">
                        Netejar filtres
                    </a>
                </div>
            </form>
        </div>

        <!-- TAULA DE RESERVES -->
        <div class="card">
            <table style="width: 100%; text-align: left; border-collapse: collapse;">

                <tr style="border-bottom: 2px solid #eee;">
                    <th style="padding: 10px;">Codi</th>

                    <th style="padding: 10px;"
                        sec:authorize="hasAnyRole('ADMIN','ADMINISTRADOR','AGENT')">
                        Client
                    </th>

                    <th style="padding: 10px;">Vehicle</th>
                    <th style="padding: 10px;">Dates</th>
                    <th style="padding: 10px;">Import</th>
                    <th style="padding: 10px;">Estat</th>
                    <th style="padding: 10px;">Acció</th>
                </tr>

                <tr th:each="r : ${reserves}"
                    style="border-bottom: 1px solid #eee;"
                    th:styleappend="${r.anulacioSolicitada and r.estat != null and (r.estat.name() == 'ACTIVA' or r.estat.name() == 'PENDENT')} ? 'background-color: #fff8e1;' : ''">

                    <td style="padding: 10px;" th:text="${r.codiReserva}"></td>

                    <!-- CLIENT -->
                    <td style="padding: 10px;"
                        sec:authorize="hasAnyRole('ADMIN','ADMINISTRADOR','AGENT')">

                        <span th:text="${(r.client.nom != null ? r.client.nom : '') + (r.client.cognoms != null ? ' ' + r.client.cognoms : '')}"></span>

                        <span th:if="${r.anulacioSolicitada and r.estat != null and (r.estat.name() == 'ACTIVA' or r.estat.name() == 'PENDENT')}"
                              style="margin-left: 8px; background-color: #f0ad4e; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; white-space: nowrap;">
                            HA SOL·LICITAT ANUL·LAR-LA
                        </span>

                        <br>

                        <small style="color: #777;" th:text="${r.client.email}"></small>
                    </td>

                    <!-- VEHICLE -->
                    <td style="padding: 10px;"
                        th:text="${r.vehicle.marca + ' ' + r.vehicle.model}">
                    </td>

                    <!-- DATES -->
                    <td style="padding: 10px;"
                        th:text="${r.dataInici + ' a ' + r.dataFi}">
                    </td>

                    <!-- IMPORT -->
                    <td style="padding: 10px;"
                        th:text="${r.importTotal != null ? #numbers.formatDecimal(r.importTotal, 1, 2) + ' €' : '—'}">
                    </td>

                    <!-- ESTAT -->
                    <td style="padding: 10px;">

                        <strong th:text="${r.estat}"
                                th:style="${r.estat != null and r.estat.name() == 'ACTIVA'} ? 'color: green;' : 'color: red;'">
                        </strong>

                        <div th:if="${r.anulacioSolicitada and r.estat != null and (r.estat.name() == 'ACTIVA' or r.estat.name() == 'PENDENT')}"
                             style="margin-top: 4px;">

                            <span style="background-color: #f0ad4e; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold;">
                                Anul·lació sol·licitada
                            </span>
                        </div>
                    </td>

                    <!-- ACCIONS -->
                    <td style="padding: 10px;">

                        <!-- AGENT / ADMIN: ACCEPTAR O REBUTJAR SOL·LICITUD -->
                        <div sec:authorize="hasAnyRole('ADMIN','ADMINISTRADOR','AGENT')"
                             th:if="${r.anulacioSolicitada and r.estat != null and (r.estat.name() == 'ACTIVA' or r.estat.name() == 'PENDENT')}"
                             style="display: flex; flex-direction: column; gap: 8px;">

                            <!-- ACCEPTAR -->
                            <form th:action="@{/reserva/anullar/{id}(id=${r.id})}"
                                  method="post"
                                  onsubmit="return confirm('Vols acceptar l’anul·lació? Es calcularà la devolució del 100% o del 85% i s’enviarà un correu al client.');">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>

                                <button type="submit" class="btn"
                                        style="background-color: #5cb85c; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%;">
                                    Acceptar anul·lació
                                </button>
                            </form>

                            <!-- REBUTJAR -->
                            <form th:action="@{/reserva/rebutjar-anulacio/{id}(id=${r.id})}"
                                  method="post"
                                  onsubmit="return confirm('Vols rebutjar la sol·licitud? La reserva continuarà activa i s’enviarà un correu al client.');">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>

                                <button type="submit" class="btn"
                                        style="background-color: #d9534f; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%;">
                                    Rebutjar
                                </button>
                            </form>
                        </div>

                        <!-- AGENT / ADMIN: LLIURAR VEHICLE -->
                        <a sec:authorize="hasAnyRole('ADMIN','ADMINISTRADOR','AGENT')"
                           th:if="${!r.anulacioSolicitada and r.estat != null and (r.estat.name() == 'ACTIVA' or r.estat.name() == 'PENDENT')}"
                           th:href="@{/reserva/lliurar/{id}(id=${r.id})}"
                           class="btn btn-sm"
                           style="background-color: #0d7377; color: white; padding: 8px 12px; border-radius: 4px; text-decoration: none; margin-right: 6px;">
                            Lliurar
                        </a>

                        <!-- AGENT / ADMIN: RETORNAR VEHICLE -->
                        <a sec:authorize="hasAnyRole('ADMIN','ADMINISTRADOR','AGENT')"
                           th:if="${r.estat != null and r.estat.name() == 'EN_CURS'}"
                           th:href="@{/reserva/retornar/{id}(id=${r.id})}"
                           class="btn btn-sm"
                           style="background-color: #1e2a5e; color: white; padding: 8px 12px; border-radius: 4px; text-decoration: none; margin-right: 6px;">
                            Retornar
                        </a>

                        <!-- CLIENT: SOL·LICITAR ANUL·LACIÓ -->
                        <form sec:authorize="hasRole('CLIENT') and !hasAnyRole('ADMIN','ADMINISTRADOR','AGENT')"
                              th:if="${!r.anulacioSolicitada and r.estat != null and (r.estat.name() == 'ACTIVA' or r.estat.name() == 'PENDENT')}"
                              th:action="@{/reserva/solicitar-anulacio/{id}(id=${r.id})}"
                              method="post"
                              style="display:inline"
                              onsubmit="return confirm('Segur que vols sol·licitar anul·lar aquesta reserva? Un agent la revisarà.');">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>

                            <button type="submit" class="btn"
                                    style="background-color: #f0ad4e; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">
                                Sol·licitar anul·lació
                            </button>
                        </form>

                        <!-- CLIENT: ESTAT DE LA SOL·LICITUD -->
                        <span sec:authorize="hasRole('CLIENT') and !hasAnyRole('ADMIN','ADMINISTRADOR','AGENT')"
                              th:if="${r.anulacioSolicitada}"
                              style="color: #b8860b; font-weight: bold;">
                            Sol·licitud pendent de revisió
                        </span>

                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(reserves)}">
                    <td colspan="7"
                        style="padding: 20px; text-align: center; color: #777;">
                        No s'han trobat reserves amb aquests criteris.
                    </td>
                </tr>

            </table>
        </div>

    </main>
</div>

</body>
</html>
