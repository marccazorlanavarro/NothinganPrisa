<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e2a5e">
    <title>Lliurament de vehicle · Nothingan Pri S.A.</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/office :: topbar}"></div>

<div class="app">
    <input type="checkbox" id="side" class="side-toggle" aria-label="Menú de gestió">
    <div th:replace="~{fragments/office :: sidebar(activeMenu='lliuraments')}"></div>
    <label class="scrim" for="side" aria-label="Tancar el menú"></label>

    <main class="main">
        <div class="page-head">
            <h1>Lliurament del vehicle</h1>
            <p>Agent / Administrador · Registre d'entrega del vehicle al client.</p>
        </div>

        <div class="alert ok" role="status" th:if="${missatge}" th:text="${missatge}"></div>
        <div class="alert err" role="alert" th:if="${error}">
            <strong>Error:</strong>
            <span th:text="${error}">Motiu</span>
        </div>

        <form class="split" th:action="@{/reserva/lliurar/{id}(id=${reserva.id})}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="stack-gap">
                <section class="card">
                    <h2>Dades de la reserva</h2>
                    <div class="row-2">
                        <div class="field">
                            <label>Codi reserva</label>
                            <input class="input" type="text" th:value="${reserva.codiReserva}" disabled>
                        </div>
                        <div class="field">
                            <label>Estat actual</label>
                            <input class="input" type="text" th:value="${reserva.estat}" disabled>
                        </div>
                    </div>
                    <div class="row-2">
                        <div class="field">
                            <label>Data inici</label>
                            <input class="input" type="text" th:value="${reserva.dataInici}" disabled>
                        </div>
                        <div class="field">
                            <label>Data fi</label>
                            <input class="input" type="text" th:value="${reserva.dataFi}" disabled>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>Vehicle i client</h2>
                    <div class="row-2">
                        <div class="field">
                            <label>Vehicle</label>
                            <input class="input" type="text"
                                   th:value="${reserva.vehicle.marca + ' ' + reserva.vehicle.model + ' (' + reserva.vehicle.matricula + ')'}"
                                   disabled>
                        </div>
                        <div class="field">
                            <label>Client</label>
                            <input class="input" type="text"
                                   th:value="${reserva.client.nom + ' ' + reserva.client.cognoms}"
                                   disabled>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>Registre de sortida</h2>
                    <div class="field">
                        <label for="kmsInicials">Quilòmetres actuals del vehicle *</label>
                        <input id="kmsInicials" name="kmsInicials" type="number" class="input" placeholder="Ex: 45000" required>
                    </div>
                    <div class="field">
                        <label for="observacions">Observacions del lliurament</label>
                        <textarea id="observacions" name="observacions" class="textarea" rows="4"
                                  placeholder="Estat de la carroceria, nivell de combustible, etc."></textarea>
                    </div>
                    <div class="field">
                        <label>Fotos de lliurament (mínim 1, màx 3) *</label>
                        <!-- FIX: names = foto1, foto2, foto3 (coinciden con @RequestParam) -->
                        <input type="file" name="foto1" accept="image/jpeg,image/png,image/webp" required>
                        <input type="file" name="foto2" accept="image/jpeg,image/png,image/webp">
                        <input type="file" name="foto3" accept="image/jpeg,image/png,image/webp">
                        <small style="color:#666">JPG, PNG o WEBP · Màx 5MB cada una</small>
                    </div>
                </section>
            </div>

            <aside class="stack-gap">
                <section class="card">
                    <h2>Confirmar lliurament</h2>
                    <p class="muted mb">En confirmar, l'estat de la reserva passarà a <strong>EN_CURS</strong>.</p>
                    <div class="btn-row" style="margin-top:0">
                        <button class="btn btn-teal btn-block" type="submit">Confirmar lliurament</button>
                        <a class="btn btn-outline btn-block" th:href="@{/reserva/meves}">Cancel·lar</a>
                    </div>
                </section>
            </aside>
        </form>
    </main>
</div>

</body>
</html>
