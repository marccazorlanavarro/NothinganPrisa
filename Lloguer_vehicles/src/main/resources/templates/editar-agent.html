
<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e2a5e">

    <title>Editar agent · Nothingan Pri S.A.</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<!-- TOPBAR COMPARTIDA -->
<div th:replace="~{fragments/office :: topbar}"></div>

<div class="app">

    <!-- CONTROL DEL MENÚ LATERAL -->
    <input type="checkbox"
           id="side"
           class="side-toggle"
           aria-label="Menú de gestió">

    <!-- SIDEBAR COMPARTIDA -->
    <div th:replace="~{fragments/office :: sidebar(activeMenu='agents')}"></div>

    <!-- FONS PER TANCAR EL MENÚ -->
    <label class="scrim"
           for="side"
           aria-label="Tancar el menú">
    </label>

    <!-- CONTINGUT PRINCIPAL -->
    <main class="main">

        <div class="page-head">
            <h1>Editar agent</h1>
            <p>
                Modifica les dades de l'agent seleccionat.
            </p>
        </div>

        <!-- MISSATGE D'ERROR -->
        <div class="card wide">

            <div th:if="${error != null}"
                 class="alert alert-danger"
                 role="alert">
                <p th:text="${error}"></p>
            </div>

            <!-- FORMULARI D'EDICIÓ -->
            <form th:action="@{/admin/agents/editar/{id}(id=${agent.id})}"
                  th:object="${agent}"
                  method="post">

                <!-- TOKEN CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- DNI I NOM -->
                <div class="row">

                    <div class="field">
                        <label for="DNI">DNI</label>

                        <input class="input"
                               type="text"
                               id="DNI"
                               th:field="*{DNI}"
                               readonly>

                        <small th:if="${#fields.hasErrors('DNI')}"
                               th:errors="*{DNI}">
                        </small>
                    </div>

                    <div class="field">
                        <label for="nom">Nom</label>

                        <input class="input"
                               type="text"
                               id="nom"
                               th:field="*{nom}"
                               placeholder="Introdueix el nom">

                        <small th:if="${#fields.hasErrors('nom')}"
                               th:errors="*{nom}">
                        </small>
                    </div>

                </div>

                <!-- COGNOMS I TELÈFON -->
                <div class="row">

                    <div class="field">
                        <label for="cognoms">Cognoms</label>

                        <input class="input"
                               type="text"
                               id="cognoms"
                               th:field="*{cognoms}"
                               placeholder="Introdueix els cognoms">

                        <small th:if="${#fields.hasErrors('cognoms')}"
                               th:errors="*{cognoms}">
                        </small>
                    </div>

                    <div class="field">
                        <label for="telefon">Telèfon</label>

                        <input class="input"
                               type="tel"
                               id="telefon"
                               th:field="*{telefon}"
                               placeholder="Introdueix el telèfon">

                        <small th:if="${#fields.hasErrors('telefon')}"
                               th:errors="*{telefon}">
                        </small>
                    </div>

                </div>

                <!-- EMAIL I DATA DE CONTRACTACIÓ -->
                <div class="row">

                    <div class="field">
                        <label for="email">Correu electrònic</label>

                        <input class="input"
                               type="email"
                               id="email"
                               th:field="*{email}"
                               placeholder="Introdueix el correu electrònic">

                        <small th:if="${#fields.hasErrors('email')}"
                               th:errors="*{email}">
                        </small>
                    </div>

                    <div class="field">
                        <label for="dataContracte">
                            Data de contractació
                        </label>

                        <input class="input"
                               type="date"
                               id="dataContracte"
                               th:field="*{dataContracte}">

                        <small th:if="${#fields.hasErrors('dataContracte')}"
                               th:errors="*{dataContracte}">
                        </small>
                    </div>

                </div>

                <!-- BOTONS -->
                <div class="btn-row end">

                    <a class="btn btn-outline"
                       th:href="@{/admin/agents}">
                        Cancel·lar
                    </a>

                    <button class="btn btn-teal" type="submit">
                        Guardar canvis
                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
