<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e2a5e">
    <title>Reserva creada · Nothingan Pri S.A.</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<!--
  Pantalla de resum de la reserva (RF53). El client hi arriba just després de confirmar
  la reserva: ReservaController.confirmacioReserva() li passa "reserva" i "dies".
-->

<body>

<div th:replace="~{fragments/office :: topbar}"></div>

<div class="app">
    <input type="checkbox" id="side" class="side-toggle" aria-label="Menú de gestió">
    <div th:replace="~{fragments/office :: sidebar(activeMenu='reserves')}"></div>
    <label class="scrim" for="side" aria-label="Tancar el menú"></label>

    <main class="main">
        <section class="card center-text" style="max-width: 720px; margin: 0 auto; padding: 30px;">

            <div style="font-size: 48px; line-height: 1;" aria-hidden="true">✅</div>
            <h1 style="margin-top: 10px;">Reserva creada amb èxit!</h1>
            <p class="lead">Aquests són els detalls de la teva reserva.</p>

            <!-- Foto del vehicle (si en té) -->
            <div th:if="${reserva.vehicle.fotoUrl != null}"
                 style="width: 100%; max-width: 360px; height: 180px; overflow: hidden; margin: 20px auto 0; border-radius: 8px;">
                <img th:src="@{${reserva.vehicle.fotoUrl}}"
                     th:alt="${reserva.vehicle.marca + ' ' + reserva.vehicle.model}"
                     style="width: 100%; height: 100%; object-fit: cover;">
            </div>

            <!-- Detalls, els mateixos que a "Les meves reserves" -->
            <dl style="display: grid; grid-template-columns: 1fr auto; gap: 12px 20px; text-align: left; margin: 25px 0 10px; padding: 0 10px;">
                <dt style="color: #666;">Codi de reserva</dt>
                <dd style="text-align: right; font-weight: bold; margin: 0;" th:text="${reserva.codiReserva}">ABC12345</dd>

                <dt style="color: #666;">Client</dt>
                <dd style="text-align: right; margin: 0;"
                    th:text="${(reserva.client.nom != null ? reserva.client.nom : '') + (reserva.client.cognoms != null ? ' ' + reserva.client.cognoms : '')}">Nom Cognoms</dd>

                <dt style="color: #666;">Vehicle</dt>
                <dd style="text-align: right; margin: 0;" th:text="${reserva.vehicle.marca + ' ' + reserva.vehicle.model}">Marca Model</dd>

                <dt style="color: #666;">Data d'inici</dt>
                <dd style="text-align: right; margin: 0;" th:text="${reserva.dataInici}">01/01/26</dd>

                <dt style="color: #666;">Data final</dt>
                <dd style="text-align: right; margin: 0;" th:text="${reserva.dataFi}">03/01/26</dd>

                <dt style="color: #666;">Durada</dt>
                <dd style="text-align: right; margin: 0;" th:text="${dies == 1} ? '1 dia' : |${dies} dies|">2 dies</dd>

                <dt style="color: #666;">Estat</dt>
                <dd style="text-align: right; margin: 0; font-weight: bold; color: green;"
                    th:text="${reserva.estat.nomFormatejat}">Activa</dd>
            </dl>

            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2em; border-top: 2px solid #eee; padding: 12px 10px 0; margin-bottom: 25px;">
                <span>Import total <small style="font-weight: normal; color: #666;">(inclou la fiança)</small></span>
                <span th:text="${reserva.importTotal != null ? #numbers.formatDecimal(reserva.importTotal, 1, 2) + ' €' : '—'}">0,00 €</span>
            </div>

            <!-- Navegació -->
            <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                <a th:href="@{/cataleg}" class="btn btn-teal"
                   style="text-decoration: none; padding: 10px 16px; border-radius: 5px;">Tornar al catàleg</a>
                <a th:href="@{/}" class="btn btn-outline"
                   style="text-decoration: none; padding: 10px 16px; border-radius: 5px; border: 1px solid #1e2a5e; color: #1e2a5e;">Tornar a l'inici</a>
                <a th:href="@{/reserva/meves}" class="btn btn-outline"
                   style="text-decoration: none; padding: 10px 16px; border-radius: 5px; border: 1px solid #1e2a5e; color: #1e2a5e;">Les meves reserves</a>
            </div>

        </section>
    </main>
</div>
</body>
</html>
