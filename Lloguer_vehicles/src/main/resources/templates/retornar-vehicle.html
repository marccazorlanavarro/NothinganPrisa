<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e2a5e">
    <title>Retorn de vehicle · Nothingan Pri S.A.</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/office :: topbar}"></div>

<div class="app">
    <input type="checkbox" id="side" class="side-toggle" aria-label="Menú de gestió">
    <div th:replace="~{fragments/office :: sidebar(activeMenu='reserves')}"></div>
    <label class="scrim" for="side" aria-label="Tancar el menú"></label>

    <main class="main">
        <div class="page-head">
            <h1>Retorn del vehicle</h1>
            <p>Agent / Administrador · Registre de la tornada del vehicle.</p>
        </div>

        <div class="alert ok" role="status" th:if="${missatge}" th:text="${missatge}"></div>
        <div class="alert err" role="alert" th:if="${error}">
            <strong>Error:</strong>
            <span th:text="${error}">Motiu</span>
        </div>

        <form class="split" th:action="@{/reserva/retornar/{id}(id=${reserva.id})}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="stack-gap">
                <section class="card">
                    <h2>Dades de la reserva</h2>
                    <div class="row-2">
                        <div class="field">
                            <label>Codi reserva</label>
                            <input class="input" type="text" th:value="${reserva.codiReserva}" disabled>
                        </div>
                        <div class="field">
                            <label>Estat actual</label>
                            <input class="input" type="text" th:value="${reserva.estat}" disabled>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>Registre de retorn</h2>
                    <div class="field">
                        <!-- FIX: name="quilometresFinals" (coincide con @RequestParam) -->
                        <label for="quilometresFinals">Quilòmetres finals del vehicle *</label>
                        <input id="quilometresFinals" name="quilometresFinals" type="number" class="input" placeholder="Ex: 45230" required>
                    </div>
                    <div class="field">
                        <!-- FIX: name="observacionsRetorn" (coincide con @RequestParam) -->
                        <label for="observacionsRetorn">Observacions del retorn</label>
                        <textarea id="observacionsRetorn" name="observacionsRetorn" class="textarea" rows="4"
                                  placeholder="Estat de la carroceria, danys, nivell de combustible, etc."></textarea>
                    </div>
                    <div class="field">
                        <label>Fotos de retorn (mínim 1, màx 3) *</label>
                        <input type="file" name="foto1" accept="image/jpeg,image/png,image/webp" required>
                        <input type="file" name="foto2" accept="image/jpeg,image/png,image/webp">
                        <input type="file" name="foto3" accept="image/jpeg,image/png,image/webp">
                        <small style="color:#666">JPG, PNG o WEBP · Màx 5MB cada una</small>
                    </div>
                </section>
            </div>

            <aside class="stack-gap">
                <section class="card">
                    <h2>Confirmar retorn</h2>
                    <p class="muted mb">L'estat passarà a <strong>FINALITZADA</strong>.</p>
                    <button class="btn btn-teal btn-block" type="submit">Confirmar retorn</button>
                    <a class="btn btn-outline btn-block" th:href="@{/reserva/meves}">Cancel·lar</a>
                </section>
            </aside>
        </form>
    </main>
</div>

</body>
</html>
