<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e2a5e">

    <title>Registre de client · Nothingan Pri S.A.</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <header class="topbar">
        <div class="topbar-inner">

            <a class="brand" th:href="@{/}">
                <span class="brand-mark">N</span>
                <span>Nothingan Pri S.A.</span>
            </a>

            <nav class="nav">
                <a th:href="@{/login}">Inicia sessió</a>
                <a class="active" th:href="@{/registre}">Registra't</a>
            </nav>

        </div>
    </header>

    <main class="container">
        <div class="center-col">

            <section class="card wide">

                <!-- PASSOS DEL REGISTRE -->
                <div class="steps">
                    <span class="step active">1. Dades personals</span>
                    <span class="step">2. Documentació</span>
                    <span class="step">3. Revisió</span>
                </div>

                <h1>Crea el teu compte</h1>

                <p class="muted">
                    Introdueix les teves dades per registrar-te com a client.
                </p>

                <!-- MISSATGE D'ERROR DEL SERVIDOR -->
                <div th:if="${error}"
                     class="error"
                     th:text="${error}">
                </div>

                <!-- FORMULARI DE REGISTRE -->
                <form th:action="@{/registre}"
                      th:object="${registre}"
                      method="post"
                      onsubmit="return comprovarContrasenyes()">

                    <!-- PROTECCIÓ CSRF -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <!-- NOM I COGNOMS -->
                    <div class="row-2">

                        <div class="field">
                            <label for="nom">Nom</label>

                            <input class="input"
                                   type="text"
                                   id="nom"
                                   th:field="*{nom}"
                                   autocomplete="given-name"
                                   required>

                            <small class="error"
                                   th:if="${#fields.hasErrors('nom')}"
                                   th:errors="*{nom}">
                            </small>
                        </div>

                        <div class="field">
                            <label for="cognoms">Cognoms</label>

                            <input class="input"
                                   type="text"
                                   id="cognoms"
                                   th:field="*{cognoms}"
                                   autocomplete="family-name"
                                   required>

                            <small class="error"
                                   th:if="${#fields.hasErrors('cognoms')}"
                                   th:errors="*{cognoms}">
                            </small>
                        </div>

                    </div>

                    <!-- CORREU I TELÈFON -->
                    <div class="row-2">

                        <div class="field">
                            <label for="email">Correu electrònic</label>

                            <input class="input"
                                   type="email"
                                   id="email"
                                   th:field="*{email}"
                                   autocomplete="email"
                                   required>

                            <small class="error"
                                   th:if="${#fields.hasErrors('email')}"
                                   th:errors="*{email}">
                            </small>
                        </div>

                        <div class="field">
                            <label for="telefon">Telèfon</label>

                            <input class="input"
                                   type="tel"
                                   id="telefon"
                                   th:field="*{telefon}"
                                   autocomplete="tel"
                                   required>

                            <small class="error"
                                   th:if="${#fields.hasErrors('telefon')}"
                                   th:errors="*{telefon}">
                            </small>
                        </div>

                    </div>

                    <!-- NACIONALITAT I ADREÇA -->
                    <div class="row-2">

                        <div class="field">
                            <label for="nacionalitat">Nacionalitat</label>

                            <select class="input"
                                    id="nacionalitat"
                                    th:field="*{nacionalitat}"
                                    required>

                                <option value="">Selecciona una nacionalitat</option>
                                <option value="Espanyola">Espanyola</option>
                                <option value="Andorrana">Andorrana</option>
                                <option value="Francesa">Francesa</option>
                                <option value="Italiana">Italiana</option>
                                <option value="Portuguesa">Portuguesa</option>
                                <option value="Alemanya">Alemanya</option>
                                <option value="Britànica">Britànica</option>
                                <option value="Romanesa">Romanesa</option>
                                <option value="Marroquina">Marroquina</option>
                                <option value="Algeriana">Algeriana</option>
                                <option value="Xinesa">Xinesa</option>
                                <option value="Índia">Índia</option>
                                <option value="Pakistanesa">Pakistanesa</option>
                                <option value="Estatunidenca">Estatunidenca</option>
                                <option value="Veneçola">Veneçola</option>
                                <option value="Canadenca">Canadenca</option>
                                <option value="Brasilenya">Brasilenya</option>
                                <option value="Argentina">Argentina</option>
                                <option value="Colombiana">Colombiana</option>
                                <option value="Mexicana">Mexicana</option>
                                <option value="Xilena">Xilena</option>
                                <option value="Ucraïnesa">Ucraïnesa</option>
                                <option value="Russa">Russa</option>
                                <option value="Senegalesa">Senegalesa</option>
                                <option value="Nigeriana">Nigeriana</option>
                                <option value="Japonesa">Japonesa</option>
                                <option value="Australiana">Australiana</option>
                                <option value="Una altra">Una altra</option>

                            </select>

                            <small class="error"
                                   th:if="${#fields.hasErrors('nacionalitat')}"
                                   th:errors="*{nacionalitat}">
                            </small>
                        </div>

                        <div class="field">
                            <label for="adreca">Adreça</label>

                            <input class="input"
                                   type="text"
                                   id="adreca"
                                   th:field="*{adreca}"
                                   autocomplete="street-address"
                                   required>

                            <small class="error"
                                   th:if="${#fields.hasErrors('adreca')}"
                                   th:errors="*{adreca}">
                            </small>
                        </div>

                    </div>

                    <!-- CONTRASENYES -->
                    <div class="row-2">

                        <div class="field">
                            <label for="password">Contrasenya</label>

                            <div style="position: relative;">

                                <input class="input"
                                       type="password"
                                       id="password"
                                       th:field="*{password}"
                                       autocomplete="new-password"
                                       minlength="8"
                                       required
                                       style="padding-right: 45px;">

                                <button type="button"
                                        onclick="mostrarPassword('password', this)"
                                        aria-label="Mostrar contrasenya"
                                        style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: transparent; border: none; padding: 0; cursor: pointer;">
                                    👁
                                </button>

                            </div>

                            <small class="error"
                                   th:if="${#fields.hasErrors('password')}"
                                   th:errors="*{password}">
                            </small>
                        </div>

                        <div class="field">
                            <label for="confirmacio">Repeteix la contrasenya</label>

                            <div style="position: relative;">

                                <input class="input"
                                       type="password"
                                       id="confirmacio"
                                       name="confirmacio"
                                       autocomplete="new-password"
                                       minlength="8"
                                       required
                                       style="padding-right: 45px;">

                                <button type="button"
                                        onclick="mostrarPassword('confirmacio', this)"
                                        aria-label="Mostrar confirmació de contrasenya"
                                        style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: transparent; border: none; padding: 0; cursor: pointer;">
                                    👁
                                </button>

                            </div>
                        </div>

                    </div>

                    <!-- ERROR DE CONTRASENYES -->
                    <p id="errorContrasenya"
                       class="error"
                       role="alert"
                       style="display: none;">
                        Les contrasenyes no coincideixen.
                    </p>

                    <!-- POLÍTICA DE PRIVACITAT -->
                    <div class="field">

                        <label style="display: flex; align-items: flex-start; gap: 8px;">

                            <input type="checkbox"
                                   id="privacitat"
                                   name="privacitat"
                                   required
                                   style="margin-top: 4px;">

                            <span>
                                He llegit la
                                <a th:href="@{/privacitat}"
                                   target="_blank"
                                   rel="noopener noreferrer">
                                    política de privacitat
                                </a>
                                i accepto el tractament de les meves dades
                                per a les finalitats que s'hi expliquen.
                            </span>

                        </label>

                    </div>

                    <!-- BOTÓ PER ENVIAR EL FORMULARI -->
                    <button type="submit" class="btn btn-block">
                        Continuar a la documentació
                    </button>

                    <p class="muted center-text mt">
                        Ja tens un compte?
                        <a th:href="@{/login}">Inicia sessió</a>
                    </p>

                </form>

            </section>

        </div>
    </main>

    <!-- FUNCIONS JAVASCRIPT -->
    <script>

        // MOSTRAR O AMAGAR LA CONTRASENYA
        function mostrarPassword(id, boto) {

            const camp = document.getElementById(id);

            if (camp.type === "password") {

                camp.type = "text";
                boto.textContent = "🙈";
                boto.setAttribute("aria-label", "Amagar contrasenya");

            } else {

                camp.type = "password";
                boto.textContent = "👁";
                boto.setAttribute("aria-label", "Mostrar contrasenya");

            }
        }

        // COMPROVAR QUE LES CONTRASENYES COINCIDEIXIN
        function comprovarContrasenyes() {

            const password = document.getElementById("password").value;
            const confirmacio = document.getElementById("confirmacio").value;
            const error = document.getElementById("errorContrasenya");

            if (password !== confirmacio) {

                error.style.display = "block";
                return false;

            }

            error.style.display = "none";
            return true;
        }

    </script>

</body>
</html>
