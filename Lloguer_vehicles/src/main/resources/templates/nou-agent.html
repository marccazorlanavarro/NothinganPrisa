
<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e2a5e">

    <title>Registrar agent · Nothingan Pri S.A.</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<!-- TOPBAR -->
<div th:replace="~{fragments/office :: topbar}"></div>

<div class="app">

    <!-- CONTROL DEL MENÚ -->
    <input type="checkbox"
           id="side"
           class="side-toggle"
           aria-label="Menú de gestió">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/office :: sidebar(activeMenu='agents')}"></div>

    <!-- FONS PER TANCAR EL MENÚ -->
    <label class="scrim"
           for="side"
           aria-label="Tancar el menú">
    </label>

    <!-- CONTINGUT PRINCIPAL -->
    <main class="main">

        <div class="page-head">
            <h1>Registrar nou agent</h1>

            <p>
                Introdueix les dades del nou treballador de Nothingan Pri S.A.
            </p>
        </div>

        <div class="card">

            <!-- MISSATGE D'ERROR -->
            <div th:if="${error}"
                 class="alert alert-danger"
                 role="alert"
                 th:text="${error}">
            </div>

            <!-- FORMULARI DE REGISTRE -->
            <form th:action="@{/admin/agents/guardar}"
                  th:object="${agent}"
                  method="post">

                <!-- TOKEN CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- DNI -->
                <div class="field">
                    <label for="DNI">DNI</label>

                    <input class="input"
                           type="text"
                           id="DNI"
                           th:field="*{DNI}"
                           placeholder="Introdueix el DNI"
                           required>
                </div>

                <!-- NOM -->
                <div class="field">
                    <label for="nom">Nom</label>

                    <input class="input"
                           type="text"
                           id="nom"
                           th:field="*{nom}"
                           placeholder="Introdueix el nom"
                           required>
                </div>

                <!-- COGNOMS -->
                <div class="field">
                    <label for="cognoms">Cognoms</label>

                    <input class="input"
                           type="text"
                           id="cognoms"
                           th:field="*{cognoms}"
                           placeholder="Introdueix els cognoms"
                           required>
                </div>

                <!-- TELÈFON -->
                <div class="field">
                    <label for="telefon">Telèfon</label>

                    <input class="input"
                           type="tel"
                           id="telefon"
                           th:field="*{telefon}"
                           placeholder="Introdueix el telèfon"
                           required>
                </div>

                <!-- EMAIL -->
                <div class="field">
                    <label for="email">Correu electrònic</label>

                    <input class="input"
                           type="email"
                           id="email"
                           th:field="*{email}"
                           placeholder="Introdueix el correu electrònic"
                           required>
                </div>

                <!-- CONTRASENYA -->
                <div class="field">
                    <label for="password">Contrasenya</label>

                    <input class="input"
                           type="password"
                           id="password"
                           th:field="*{password}"
                           placeholder="Introdueix la contrasenya"
                           required>
                </div>

                <!-- DATA DE CONTRACTACIÓ -->
                <div class="field">
                    <label for="dataContracte">
                        Data de contractació
                    </label>

                    <input class="input"
                           type="date"
                           id="dataContracte"
                           th:field="*{dataContracte}">
                </div>

                <!-- ROL -->
                <div class="field">
                    <label for="rol">Rol</label>

                    <select class="input"
                            id="rol"
                            th:field="*{rol}"
                            required>

                        <option value="">Selecciona un rol</option>
                        <option value="AGENT">Agent</option>
                        <option value="ADMIN">Administrador</option>

                    </select>
                </div>

                <!-- BOTONS -->
                <div class="toolbar">

                    <button class="btn" type="submit">
                        Registrar agent
                    </button>

                    <a class="btn"
                       th:href="@{/admin/agents}">
                        Cancel·lar
                    </a>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
