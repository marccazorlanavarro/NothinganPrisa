
<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisar sol·licitud</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px 15px;
            color: #333;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h1, h2 { color: #263445; }
        h1 { margin-top: 0; }
        h2 { font-size: 20px; margin-top: 25px; }

        .info {
            background: #f5f7fa;
            padding: 18px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .field { margin-bottom: 18px; }

        .field label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .field p {
            margin: 0;
            overflow-wrap: anywhere;
        }

        .document-preview {
            display: block;
            max-width: 100%;
            max-height: 350px;
            border-radius: 8px;
            margin-top: 10px;
        }

        a { color: #1769aa; }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 15px;
            resize: vertical;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        button, .back-link {
            display: inline-block;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        .reject-button {
            background: #c0392b;
            color: white;
        }

        .reject-button:hover { background: #a93226; }

        .back-link {
            background: #e5e9ef;
            color: #263445;
        }

        .alert-error {
            background: #fde8e8;
            color: #b42318;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        hr {
            border: 0;
            border-top: 1px solid #ddd;
            margin: 25px 0;
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .actions { flex-direction: column; }

            button, .back-link {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Revisar sol·licitud</h1>

    <div th:if="${error != null}"
         class="alert-error"
         th:text="${error}"></div>

    <div class="info" th:if="${solicitud != null}">

        <div class="field">
            <label>ID de la sol·licitud</label>
            <p th:text="${solicitud.id}"></p>
        </div>

        <div class="field">
            <label>Tipus de sol·licitud</label>
            <p th:text="${solicitud.tipo}"></p>
        </div>

        <div class="field">
            <label>Estat</label>
            <p th:text="${solicitud.estado}"></p>
        </div>

        <div class="field">
            <label>Data de sol·licitud</label>
            <p th:text="${solicitud.dataSolicitud}"></p>
        </div>

        <div class="field" th:if="${solicitud.cliente != null}">
            <label>Client</label>
            <p th:text="${solicitud.cliente.email}"></p>
        </div>
    </div>

    <hr>

    <h2>Dades proposades</h2>

    <div th:if="${datosLegibles != null and !datosLegibles.isEmpty()}">
        <div class="field" th:each="entrada : ${datosLegibles}">
            <label th:text="${entrada.key}"></label>
            <p th:text="${entrada.value}"></p>
        </div>
    </div>

    <div th:if="${datosLegibles == null or datosLegibles.isEmpty()}">
        <p>No hi ha dades proposades per mostrar.</p>
    </div>

    <div th:if="${fotoDniProposada != null or fotoPermisProposat != null}">
        <hr>
        <h2>Documents nous proposats</h2>

        <div th:if="${fotoDniProposada != null}" class="field">
            <label>Document d'identitat nou</label>

            <img th:if="${#strings.startsWith(fotoDniProposada, 'data:image/')}"
                 th:src="${fotoDniProposada}"
                 alt="DNI proposat"
                 class="document-preview">

            <a th:if="${#strings.startsWith(fotoDniProposada, 'data:application/pdf')}"
               th:href="${fotoDniProposada}"
               target="_blank"
               rel="noopener">
                Obrir DNI proposat en PDF
            </a>
        </div>

        <div th:if="${fotoPermisProposat != null}" class="field">
            <label>Permís de conduir nou</label>

            <img th:if="${#strings.startsWith(fotoPermisProposat, 'data:image/')}"
                 th:src="${fotoPermisProposat}"
                 alt="Permís proposat"
                 class="document-preview">

            <a th:if="${#strings.startsWith(fotoPermisProposat, 'data:application/pdf')}"
               th:href="${fotoPermisProposat}"
               target="_blank"
               rel="noopener">
                Obrir permís proposat en PDF
            </a>
        </div>
    </div>

    <hr>

    <h2>Rebutjar sol·licitud</h2>

    <form th:if="${solicitud != null}"
          th:action="@{/agent/solicitudes/rechazar}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <input type="hidden"
               name="id"
               th:value="${solicitud.id}">

        <div class="field">
            <label for="motivo">Motiu del rebuig</label>

            <textarea id="motivo"
                      name="motivo"
                      minlength="3"
                      maxlength="1000"
                      required
                      placeholder="Explica el motiu pel qual rebutges aquesta sol·licitud..."></textarea>
        </div>

        <div class="actions">
            <button type="submit" class="reject-button">
                Rebutjar sol·licitud
            </button>

            <a th:href="@{/agent/clients}" class="back-link">
                Tornar als clients
            </a>
        </div>
    </form>

</div>
</body>
</html>
