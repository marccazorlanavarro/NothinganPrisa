<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Users</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"><!-- comment -->
    </head>
    <body>
        <div class="container mt-5">
            <h2 class="mb-4">Edit user</h2>

            <!-- Formulario para editar producto -->
            <form th:action="@{/web/users/save}" th:object="${user}" method="post" class="needs-validation" novalidate>
                <!-- Campo oculto para que el password no cambie de vuelta -->
                <input type="hidden" th:field="*{pw}" />

                <!-- th:attr evalua si el campo login está vacío. En ese caso asume que es un nuevo registro y deja editar el campo.
                Una vez ya tiene valor, lo bloquea.-->
                <div class="mb-3">
                    <label for="name" class="form-label">Login</label>
                    <input type="text" id="login" class="form-control"
                           th:field="*{login}"
                           th:attr="readonly=*{#strings.isEmpty(login)? null : 'readonly'}"/>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" class="form-control"
                           th:field="*{name}" />
                </div>

                <!-- Lista de permisos -->
                <div class="mb-3">
                    <label class="form-label">Select Authorities</label>
                    <div th:each="authority : ${allAuthorities}" class="form-check">
                        <input type="checkbox"
                        th:field="*{userAuthorities}"
                        th:value="${authority}"
                        class="form-check-input"
                        id="[[${authority}]]" />

                        <label th:for="'prod-' + ${authority}" th:text="${authority}" class="form-check-label"></label>
                    </div>
                </div>

                 <!-- Campo oculto que nos devuelve si login está vacío y por tanto es new -->
                <input type="hidden" name="newUser" th:value="${#strings.isEmpty(user.getLogin()) ? 'true' : 'false'}">

                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/web/users/all}" class="btn btn-secondary">Cancel</a>

                 <!-- Mensaje de respuesta -->
                <div th:if="${message != null}"
                     th:text="${message}"
                     class="mt-3">
                </div>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
